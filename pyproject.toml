[project]
name = "bb_agents"
version = "0.1.0"
description = "Bridge bidding agents training"
requires-python = ">=3.14"
dependencies = [
     "dds3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bb_agents"]

# dds3 is built locally via the Makefile (`make build-dds`) and dropped
# into vendor/ as a wheel. The Bazel py_wheel rule mislabels it py3-none-any,
# but it actually contains a CPython 3.14 C extension (DDS pins
# python_version=3.14 in its MODULE.bazel). The runtime Python MUST match
# that ABI, hence requires-python >=3.14 and the .python-version pin — a
# mismatch fails at import with "undefined symbol: PyThreadState_*".
[tool.uv.sources]
dds3 = { path = "vendor/dds3-1.0.0-py3-none-any.whl" }
